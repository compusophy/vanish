# end-to-end gate: drive the REAL app on its PREVIEW deployment before any
# merge to main can be considered green.
#
# why this exists: ci.yml proves the code compiles and passes the suites;
# neither proves the app BOOTS. production main currently receives commits
# through merged prs whose checks were green — but those checks are all
# compile-level. a change that compiles yet blanks the page ships straight
# to users. this workflow closes that gap (STACKED_PRS_PLAN §3 P2): vercel
# builds every non-main branch as a preview deployment; we wait for the
# preview of THIS pr's head sha, point playwright at it, and assert the app
# actually comes alive: wasm initializes, Event::Ready arrives, the dock
# renders. the resulting check lands on the pr head, where
# Github::deployment_state ALREADY reads it — so merge_pr's existing gate
# refuses to merge until this passes. no new gating code needed; the loop
# closes with components that already exist.
#
# KNOWN CAVEAT (recorded in STACKED_PRS_PLAN §3 P1): vercel deployment
# protection may wall previews behind an auth interstitial. if the smoke
# ever reports the interstitial instead of the app, turn protection down
# for preview deployments or use a bypass token — do not delete this
# workflow to make the failure go away.

name: e2e

on:
  pull_request:

permissions:
  contents: read
  # needed to read commit statuses / check runs on the pr head
  checks: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install playwright chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm i --no-fund --no-audit playwright@latest
          npx playwright install --with-deps chromium

      # waits for vercel's preview deployment OF THIS SHA, then hands the
      # url to the smoke script via PREVIEW_URL.
      - name: resolve preview deployment
        id: preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATE=$(gh api "repos/$REPO/deployments?sha=$SHA&environment=preview&per_page=1" \
              --jq '.[0].id // empty' || true)
            if [ -n "$STATE" ]; then
              STATUS=$(gh api "repos/$REPO/deployments/$STATE/statuses" --jq '.[0].state')
              TARGET=$(gh api "repos/$REPO/deployments/$STATE/statuses" --jq '.[0].target_url // empty')
              echo "deployment $STATE state=$STATUS target=$TARGET"
              if [ "$STATUS" = "success" ] && [ -n "$TARGET" ]; then
                echo "url=$TARGET" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "::error::no ready preview deployment for $SHA after 15 minutes"
          exit 1

      - name: smoke the running app
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: node ci/e2e.mjs

      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            evidence/
          if-no-files-found: ignore
