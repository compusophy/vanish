[package]
name = "vanish"
version = "0.1.0"
edition = "2021"
description = "autonomous self-editing coding harness — rust/wasm, browser-resident, no backend"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

# cartridge substrate: emitted modules are round-trip validated in tests.
# default features pull std+component-model; the validator only needs core.
wasmparser = { version = "0.258", default-features = false, features = ["std", "validate"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window", "Document", "Element", "HtmlElement", "HtmlTextAreaElement",
  "HtmlInputElement", "HtmlSelectElement", "Navigator", "Location",
  "Event", "EventTarget", "MessageEvent", "KeyboardEvent", "CustomEvent", "NodeList",
  "Worker", "WorkerGlobalScope", "WorkerOptions", "WorkerType",
  "DedicatedWorkerGlobalScope",
  "Request", "RequestInit", "RequestMode", "Response", "Headers",
  "ReadableStream", "ReadableStreamDefaultReader", "ReadableStreamReadResult",
  "AbortController", "AbortSignal",
  "StorageManager", "Storage",
  "FileSystemDirectoryHandle", "FileSystemFileHandle",
  "FileSystemGetDirectoryOptions", "FileSystemGetFileOptions",
  "FileSystemWritableFileStream", "FileSystemRemoveOptions",
  "Blob", "File", "WorkerNavigator", "TextEncoder", "TextDecoder",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[features]
# the dev server is a native binary and must never be part of a wasm build
devserver = []

[[bin]]
name = "serve"
path = "src/bin/serve.rs"
required-features = ["devserver"]
